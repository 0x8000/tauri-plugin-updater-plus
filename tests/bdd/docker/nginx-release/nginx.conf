worker_processes 1;
error_log /var/log/bdd/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format bdd_json escape=json
        '{"method":"$request_method","uri":"$uri","status":$status,'
        '"range":"$http_range","sent_content_type":"$sent_http_content_type",'
        '"bytes_sent":$body_bytes_sent}';

    access_log /var/log/bdd/access.jsonl bdd_json;
    sendfile on;
    keepalive_timeout 30;

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            root /srv/releases;
            add_header Cache-Control "no-store";
        }
    }
}

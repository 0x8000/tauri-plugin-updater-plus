# See https://pre-commit.com/hooks.html for more hooks
# Generated files keep their generator's layout: plugin permission docs/schemas
# are rewritten by `tauri-plugin` in build.rs, Cargo.lock is managed by Cargo,
# and CHANGELOG.md is managed by release-please.
exclude: >-
  (?x)^(
    permissions/(autogenerated|schemas)/
    |CHANGELOG\.md$
    |Cargo\.lock$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        language: system
        types_or: [rust]
        entry: cargo fmt
        files: \.rs$
        pass_filenames: false
      - id: toml
        name: toml
        language: system
        types_or: [toml]
        entry: taplo format

  - repo: https://github.com/biomejs/pre-commit
    rev: "v2.4.10"
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.4.10"]

  - repo: https://github.com/bneijt/deno-pre-commit
    rev: 2.7.9
    hooks:
      - id: deno-fmt
        exclude: ^README\.md$
        exclude_types: ["javascript", "jsx", "ts", "tsx", "json"]

  - repo: https://github.com/cathaysia/style
    rev: v0.1.13
    hooks:
      - id: check-line-length
      - id: move-module-mod
      - id: check-linear-history
      - id: compact_workspace_deps
      - id: full-qualify-log
      - id: ast-grep-rules
      - id: check-function-params
        args: [--max-params, "5"]

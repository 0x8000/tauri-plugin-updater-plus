[workspace]
resolver = "2"
members = ["updater-plus", "tauri-plugin-updater-plus"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/0x8000/updater-plus"
homepage = "https://github.com/0x8000/updater-plus"

[workspace.dependencies]
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
document-features = "0.2"
flate2 = "1"
futures-util = "0.3"
http = "1"
infer = "0.22"
lazy-regex = "3"
minisign-verify = "0.2"
osakit = { version = "0.3", features = ["full"] }
percent-encoding = "2"
reqwest = { version = "0.13", features = ["json", "stream"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tauri = { version = "3.0.0-alpha.5", default-features = false }
tauri-plugin = { version = "3.0.0-alpha.3", features = ["build"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing = "0.1"
updater-plus = { version = "0.5.1", path = "updater-plus", default-features = false }
url = { version = "2", features = ["serde"] }
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
strip = true

[package]
name = "tauri-plugin-updater-plus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Electron-style blockmap differential updater plugin for Tauri v3 applications"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords = ["tauri", "tauri-plugin", "updater", "blockmap", "differential"]
categories = ["development-tools", "network-programming"]
links = "tauri-plugin-updater-plus"
exclude = ["/guest-js"]

[package.metadata.docs.rs]
all-features = true

[features]
## Enables the built-in HTTP providers (`http`) and OS-native installers (`native-installer`).
default = ["http", "native-installer"]

## Enables built-in HTTP, GitHub Releases, and S3 providers via `updater-plus/http` and `Builder::headers`.
http = ["dep:http", "updater-plus/http"]

## Enables the default OS-native `PlatformInstaller` facade (desktop and Android) via `updater-plus/native-installer`.
native-installer = ["updater-plus/native-installer"]

[dependencies]
document-features.workspace = true
http = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
thiserror.workspace = true
tokio.workspace = true
updater-plus = { workspace = true, features = ["engine"] }
url.workspace = true

[build-dependencies]
tauri-plugin.workspace = true

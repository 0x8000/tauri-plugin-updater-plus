name: check-unittest

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python3 -m pip install pre-commit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install taplo
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: taplo-cli

      - name: Pre-commit
        run: |
          pre-commit run -a

      - name: Cargo test (default plugin features)
        run: |
          cargo test

      - name: Cargo test (CLI only, no default features)
        run: |
          cargo test --no-default-features --features cli

      - name: Cargo test (all features)
        run: |
          cargo test --all-features

  bdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build CLI and updater harness binaries
        run: |
          cargo build --no-default-features --features cli --bin blockmap-gen
          cargo build --all-features --example updater_client

      - name: Setup BDD Python environment
        run: |
          python3 -m venv tests/bdd/.venv
          tests/bdd/.venv/bin/pip install --upgrade pip
          tests/bdd/.venv/bin/pip install -e "tests/bdd[dev]"

      - name: Lint and unit-test BDD harness
        run: |
          tests/bdd/.venv/bin/ruff check tests/bdd/features tests/bdd/scripts tests/bdd/src tests/bdd/tests tests/bdd/docker/cdn-gateway
          tests/bdd/.venv/bin/ruff format --check tests/bdd/features tests/bdd/scripts tests/bdd/src tests/bdd/tests tests/bdd/docker/cdn-gateway
          PYTHONPATH=tests/bdd/src tests/bdd/.venv/bin/python -m unittest discover -s tests/bdd/tests -v

      - name: Build BDD Docker images
        run: |
          tests/bdd/.venv/bin/python tests/bdd/scripts/build_images.py

      - name: Run BDD scenario suite
        run: |
          tests/bdd/.venv/bin/python tests/bdd/scripts/run_scenario.py

      - name: Cleanup BDD Docker resources
        if: always()
        run: |
          tests/bdd/.venv/bin/python tests/bdd/scripts/cleanup_bdd_docker.py

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cargo clippy (all features)
        run: |
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo clippy (CLI only)
        run: |
          cargo clippy --no-default-features --features cli --bin blockmap-gen -- -D warnings

  try-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check release
        run: |
          cargo publish --workspace --dry-run
